server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    gzip on;
    gzip_types application/wasm application/octet-stream text/javascript application/javascript text/css image/svg+xml application/manifest+json;

    # Revalidate everything (ETag, cheap 304s) so a phone never mixes an old loader with a new
    # build — same as fit.
    location /_framework/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The PWA service worker must always be fresh, or an old one keeps serving an old build.
    location ~ ^/service-worker(-assets)?\.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        # Client-side (Blazor Router) paths that aren't real files fall back to index.html.
        try_files $uri $uri/ /index.html;
    }
}
