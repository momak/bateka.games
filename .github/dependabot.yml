# Weekly update PRs. The Build workflow runs on each one, so a red PR means "don't merge yet".
version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - "/bateka.games"
      - "/bateka.games.Api"
      - "/bateka.games.Shared"
      - "/bateka.games.Domain"
      - "/bateka.games.Data"
      - "/bateka.games.Services"
      - "/bateka.games.Repositories"
      - "/bateka.games.Engine"
      - "/bateka.games.Engine.Tests"
      - "/bateka.games.Services.Tests"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    groups:
      # All minor/patch bumps in one PR; a major version gets its own PR to look at.
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A new major of these means a new .NET (e.g. 11) — changed by hand together with the
      # TargetFramework and the Docker images, not by a bot.
      - dependency-name: "Microsoft.*"
        update-types: [version-update:semver-major]
      - dependency-name: "System.*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories:
      - "/bateka.games"
      - "/bateka.games.Api"
    schedule:
      interval: weekly
      day: saturday
    ignore:
      # Same reason: sdk:10.0 -> 11.0 is a .NET upgrade, not a routine bump.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
