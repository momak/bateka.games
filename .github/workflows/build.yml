name: Build

# Every push (any branch) and manual runs from the Actions tab: compile the solution and run the tests.
# A push to main also builds the two Docker images and pushes them to GitHub's registry (ghcr.io);
# Watchtower on the NAS sees the new :latest within a few minutes and recreates games-api / games-client.
# The old GitHub Pages deploy (main.yml) is gone on purpose: the gh-pages branch stays frozen.
on:
  push:
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION: bateka.games.slnx
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REGISTRY: ghcr.io
  # ghcr.io/momak/bateka-games-api and ghcr.io/momak/bateka-games-client (names must be lower case)
  IMAGE_PREFIX: ghcr.io/momak/bateka-games

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # restore Bateka.UI from GitHub Packages

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      # nuget.config names the "github" source; NuGet reads its credentials from this variable.
      - name: Restore
        run: dotnet restore "$SOLUTION"
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: dotnet build "$SOLUTION" --no-restore --configuration Release

      # global.json picks the Microsoft.Testing.Platform runner (xUnit v3), same as Bateka.AI.
      - name: Test
        run: dotnet test --solution "$SOLUTION" --no-build --configuration Release

  # Only main deploys; other branches stop after the build check above.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN — no secret to manage (includes read, for Bateka.UI)

    strategy:
      matrix:
        include:
          - image: api
            dockerfile: bateka.games.Api/Dockerfile
          - image: client
            dockerfile: bateka.games/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest (what the NAS runs) and :sha-<commit> (to roll back to an exact build)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Ugreen DXP NAS = Intel. Add linux/arm64 here if the NAS is ever an ARM one.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # reuse unchanged layers (restore, SDK) between runs
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # for the client's restore of Bateka.UI (RUN --mount=type=secret); the API ignores it
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
